[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ew3w"
version = "0.1.0"
description = "Early-warning system for undesirable events in offshore oil wells (Petrobras 3W 2.0.0)"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",  # groupby.apply(include_groups=...) in metrics.summarize_events
  "pyarrow>=14",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "tabulate>=0.9",
  "matplotlib>=3.8",  # Phase 4 chart (scripts/run_degradation.py)
]

[project.optional-dependencies]
dev = ["pytest>=8"]
demo = ["streamlit>=1.35", "plotly>=5.20"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
